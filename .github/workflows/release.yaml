name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, e.g. 0.4.0)"
        required: true
        type: string
      dry-run:
        description: "Dry run (validate and build without publishing)"
        required: false
        type: boolean
        default: false
      npm-publish:
        description: "Publish library npm package to github registry"
        required: false
        type: boolean
        default: true
      docker-publish:
        description: "Publish container image to github registry"
        required: false
        type: boolean
        default: true
      bump-version:
        description: "Bump version of app and lib to input.version"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate semver format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '${{ inputs.version }}' does not match semver format (MAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Check tag does not exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Check branch is main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Releases must be created from the main branch (current: ${{ github.ref_name }})"
            exit 1
          fi

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Cypress Component Tests
            command: npm run cypress:run:component
          - name: Cypress E2E Tests
            command: npm run cypress:run:e2e
          - name: Karma Service Tests
            command: npm run lib-build && npm run lib-test -- --no-watch --browsers=GitlabHeadlessChrome
          - name: Helm Lint
            command: helm lint helm/
          - name: Helm Template
            command: helm template data-dashboard helm/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ matrix.name != 'Helm Lint' && matrix.name != 'Helm Template' }}
        with:
          node-version: "24"
      - run: npm ci
        if: ${{ matrix.name != 'Helm Lint' && matrix.name != 'Helm Template' }}
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          package-manager-cache: false

      - run: npm ci

      # --- Version bump ---
      - name: Bump version in package.json files and helm chart
        if: ${{ inputs.bump-version }}
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          cd projects/dashboard-core
          npm version "${{ inputs.version }}" --no-git-tag-version
          cd ../..
          sed -i "s/^version: .*/version: ${{ inputs.version }}/" helm/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ inputs.version }}\"/" helm/Chart.yaml
          sed -i "s/^  tag: .*/  tag: ${{ inputs.version }}/" helm/values.yaml

      - name: Regenerate Helm docs
        if: ${{ inputs.bump-version }}
        uses: losisin/helm-docs-github-action@3a4528e97c49a5e83de6b78c50c61c8ee5c9f944 # v2.0.0
        with:
          chart-search-root: helm
          template-files: README.md.gotmpl

      # --- Build library ---
      - name: Build library
        run: npm run lib-build -- --configuration production

      # --- Publish npm library (with provenance) ---
      - name: Publish npm library
        if: ${{ (!inputs.dry-run) && (inputs.npm-publish) }}
        run: npm publish --provenance --access public
        working-directory: dist/@eclipse-edc/dashboard-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Build application ---
      - name: Build application
        run: npm run build -- --configuration production

      # --- Container image ---
      - name: Install Cosign
        if: ${{ !inputs.dry-run }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/eclipse-edc/data-dashboard
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push container image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ (!inputs.dry-run) && (inputs.docker-publish) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Sign container image
        if: ${{ (!inputs.dry-run) && (inputs.docker-publish) }}
        run: cosign sign --yes ghcr.io/eclipse-edc/data-dashboard@${{ steps.build-and-push.outputs.digest }}

      # --- Helm chart ---
      - name: Package and push Helm chart
        id: helm-push
        if: ${{ (!inputs.dry-run) && (inputs.docker-publish) }}
        run: |
          helm package helm/
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          push_output=$(helm push data-dashboard-${{ inputs.version }}.tgz oci://ghcr.io/eclipse-edc/charts 2>&1)
          echo "$push_output"
          digest=$(echo "$push_output" | grep -oP 'sha256:[a-f0-9]+')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign Helm chart
        if: ${{ (!inputs.dry-run) && (inputs.docker-publish) }}
        run: cosign sign --yes ghcr.io/eclipse-edc/charts/data-dashboard@${{ steps.helm-push.outputs.digest }}

      # --- GitHub Release ---
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push version bump
        if: ${{ (!inputs.dry-run) && (inputs.bump-version) }}
        run: |
          git add package.json projects/dashboard-core/package.json helm/Chart.yaml helm/values.yaml helm/README.md
          git commit -m "chore(release): v${{ inputs.version }}"
          git push

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release view --json tagName | jq -r '.tagName')
          gh release create "v${{ inputs.version }}" --latest \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            --notes-start-tag ${latest}
